  <!-- Zero-Flash Theme Initialization Script (Runs synchronously before first paint) -->
  <script>
    (function() {
      try {
        var urlTheme = window.location.search.indexOf('theme=light') !== -1 ? 'light' : (window.location.search.indexOf('theme=dark') !== -1 ? 'dark' : null);
        var savedTheme = localStorage.getItem('intellishield-theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = urlTheme || ((savedTheme === 'light' || savedTheme === 'dark') ? savedTheme : (prefersDark ? 'dark' : 'light'));
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
