[package]
name = "intellishield-proxy"
version = "0.1.0"
edition = "2021"
authors = ["Krrish Ranjan", "Aashman Gupta"]
description = "High-performance memory-safe reverse proxy with asynchronous ML anomaly detection"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["tokio", "http1", "http2"] }
hyper = { version = "1.4", features = ["full"] }
hyper-util = { version = "0.1", features = ["full", "server", "client", "client-legacy", "http1", "http2"] }
http-body-util = "0.1"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
dashmap = "5.5"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.6"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
